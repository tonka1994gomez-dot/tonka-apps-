name: Compilar ScanPro Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/prepare-scanpro.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vite build --config vite.android.config.ts
      - run: if [ ! -d android ]; then pnpm exec cap add android; fi
      - run: pnpm exec cap sync android
      - name: Permiso de cámara
        run: python3 scripts/android-permissions.py
      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScanPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
